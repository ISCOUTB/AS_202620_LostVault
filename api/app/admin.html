<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario de objetos | LostVault</title>
<style>
  :root {
    color-scheme:light;
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    color:#172c30;
    background:#f3f6f5;
    --ink:#172c30;
    --muted:#526665;
    --edge:#d6e0dd;
    --accent:#075c4e;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; }
  header { background:#142e2d; color:#fff; }
  .wrap { width:min(1240px,calc(100% - 64px)); margin-inline:auto; }
  header .wrap { min-height:68px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .brand { display:flex; align-items:center; gap:11px; font-size:1.15rem; font-weight:750; letter-spacing:-.035em; }
  .mark { display:grid; place-items:center; width:33px; height:33px; color:#112f29; background:#aee4cb; border-radius:8px; font-size:.75rem; font-weight:850; }
  main { padding:38px 0 64px; }
  h1 { font-size:clamp(2rem,5vw,3rem); margin:0; line-height:1.1; letter-spacing:-.055em; }
  h2 { font-size:1.18rem; margin:0 0 16px; letter-spacing:-.025em; }
  .hint { color:var(--muted); margin:8px 0 20px; }
  .login { max-width:460px; margin:clamp(14px,7vh,80px) auto 0; }
  .login .sheet { border-top:3px solid var(--accent); }
  .login button { width:100%; margin-top:5px; }
  .sheet { background:#fff; border:1px solid var(--edge); padding:24px; border-radius:13px; box-shadow:0 2px 4px #162d2310; min-width:0; }
  label { display:block; font-weight:650; margin:0 0 13px; font-size:.88rem; }
  input,textarea,select,button { font:inherit; }
  input,textarea,select { width:100%; min-width:0; min-height:42px; padding:9px 11px; margin-top:5px; border:1px solid #a9bbb7; border-radius:7px; background:#fff; color:var(--ink); font-size:1rem; }
  textarea { resize:vertical; min-height:75px; }
  button { cursor:pointer; border:1px solid transparent; border-radius:7px; padding:9px 14px; font-weight:650; background:var(--accent); color:#fff; }
  button:hover { background:#064b40; }
  button.secondary { color:#075548; background:#f0f7f4; border-color:#bed3cc; }
  button.secondary:hover { background:#e1efe9; }
  header button.secondary { color:#fff; background:transparent; border-color:#74918a; }
  header button.secondary:hover { background:#294942; }
  button:disabled { cursor:wait; opacity:.65; }
  :focus-visible { outline:3px solid #377ad4; outline-offset:3px; }
  .layout { display:grid; grid-template-columns:minmax(0,2.05fr) minmax(275px,1fr); gap:20px; align-items:start; }
  .filters { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(145px,1fr); gap:12px; }
  .status { color:#165941; margin:12px 0; }
  .status:empty { margin:0; }
  .error { color:#a22222; }
  .list { list-style:none; padding:0; margin:4px 0 0; }
  .list li { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:16px 0; border-top:1px solid var(--edge); }
  .list li > div { min-width:0; overflow-wrap:anywhere; }
  .list small { display:block; color:var(--muted); margin-top:4px; }
  .list strong { display:block; font-size:1.02rem; }
  .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin:22px 0; }
  .metric { display:grid; gap:4px; padding:14px 17px; border:1px solid var(--edge); border-radius:10px; background:#fff; }
  .metric strong { font-size:1.85rem; line-height:1.1; font-variant-numeric:tabular-nums; letter-spacing:-.04em; }
  .metric span { color:var(--muted); font-weight:600; font-size:.83rem; }
  .action-set { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; }
  .action-set button { font-size:.86rem; }
  .list details { margin-top:8px; }
  .list summary { cursor:pointer; color:var(--accent); font-weight:600; }
  .list details p { margin:4px 0; font-size:.9rem; }
  .list a { color:var(--accent); }
  .navigation { display:flex; flex-wrap:wrap; gap:5px 18px; margin:20px 0 22px; border-bottom:1px solid #bccdc7; }
  .navigation button { color:var(--muted); background:transparent; border-radius:0; border-width:0 0 3px; border-color:transparent; padding:10px 3px; }
  .navigation button[aria-pressed=true] { color:var(--accent); border-color:var(--accent); }
  .navigation button:hover { color:var(--accent); }
  .pill { display:inline-block; width:fit-content; margin-top:6px; border-radius:20px; padding:2px 9px; font-size:.77rem; font-weight:700; }
  .pill.available { background:#e6efed; color:#315451; }
  .pill.claimed { background:#fff0d0; color:#784711; }
  .pill.approved { background:#e2ecff; color:#244b88; }
  .pill.delivered { background:#dff2e6; color:#226041; }
  #register > button { width:100%; }
  #reload { margin-top:7px; }
  @media(max-width:790px) { .layout { grid-template-columns:1fr; } }
  @media(max-width:560px) {
    .wrap { width:calc(100% - 28px); }
    main { padding-top:25px; }
    .sheet { padding:16px; }
    .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .filters { grid-template-columns:1fr; gap:0; }
    .list li { flex-direction:column; gap:8px; }
    .action-set { justify-content:flex-start; }
  }
</style>
<header><div class="wrap"><span class="brand"><span class="mark" aria-hidden="true">LV</span>LostVault</span><button id="logout" class="secondary" hidden>Cerrar sesión</button></div></header>
<main class="wrap">
  <section id="signin" class="login">
    <h1>Acceso del encargado</h1>
    <p class="hint">Inicia sesión con la cuenta de la oficina de objetos perdidos.</p>
    <form id="login" class="sheet">
      <label>Correo institucional<input name="email" type="email" autocomplete="username" required maxlength="254"></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
      <button>Iniciar sesión</button>
      <p id="login-error" class="status error" role="alert"></p>
    </form>
  </section>
  <section id="inventory" hidden>
    <h1>Panel del encargado</h1>
    <p id="notice" class="status" role="status" aria-live="polite"></p>
    <div id="stats" class="stats" aria-label="Resumen del inventario"></div>
    <nav class="navigation" aria-label="Secciones del panel">
      <button id="all-items" type="button" aria-pressed="true" aria-controls="inventory-view">Inventario</button>
      <button id="pending" type="button" aria-pressed="false" aria-controls="inventory-view">Reclamaciones</button>
      <button id="students" type="button" aria-pressed="false" aria-controls="students-view">Estudiantes</button>
    </nav>
    <div id="inventory-view" class="layout">
      <section class="sheet">
        <h2 id="list-heading">Objetos registrados</h2>
        <div class="filters">
          <label>Buscar<input id="search" type="search" placeholder="Nombre o descripción"></label>
          <label>Estado<select id="filter"><option value="">Todos</option><option value="available">Disponible</option><option value="claimed">Pendiente de revisión</option><option value="approved">Aprobado</option><option value="delivered">Entregado</option></select></label>
        </div>
        <ul id="list" class="list"></ul>
        <p id="empty" class="hint" hidden></p>
        <button id="reload" type="button" class="secondary">Actualizar inventario</button>
      </section>
      <form id="register" class="sheet">
        <h2>Registrar objeto recibido</h2>
        <label>Nombre<input name="name" required maxlength="120"></label>
        <label>Descripción<textarea name="description" maxlength="1000"></textarea></label>
        <label>Lugar del hallazgo<input name="foundAt" maxlength="160"></label>
        <label>Ubicación en la oficina<input name="location" maxlength="160"></label>
        <label>Enlace HTTPS a la foto<input name="photoUrl" type="url" pattern="https://.+" maxlength="2083"></label>
        <button>Registrar objeto</button>
      </form>
    </div>
    <section id="students-view" class="sheet" hidden>
      <h2>Acceso de estudiantes</h2>
      <ul id="users" class="list"></ul>
    </section>
  </section>
</main>
<script>
  const byId = (id) => document.getElementById(id);
  const states = { available: "Disponible", claimed: "Pendiente de revisión", approved: "Aprobado", delivered: "Entregado" };
  const objectsPath = "/v1/admin/objects";
  let token = "";
  let items = [];
  let users = [];
  let revision = 0;

  function message(text, error = false) {
    byId("notice").textContent = text;
    byId("notice").classList.toggle("error", error);
  }

  function showInventory(visible) {
    byId("signin").hidden = visible;
    byId("inventory").hidden = !visible;
    byId("logout").hidden = !visible;
  }

  function logout(error = "") {
    token = "";
    revision++;
    items = [];
    users = [];
    render();
    renderUsers();
    byId("register").reset();
    showInventory(false);
    byId("login-error").textContent = error;
    byId("login").elements.email.focus();
  }

  async function request(path, {method = "GET", body} = {}) {
    const sessionToken = token;
    const headers = {};
    if (sessionToken) headers.Authorization = "Bearer " + sessionToken;
    if (body) headers["Content-Type"] = "application/json";
    const response = await fetch(path, {
      method, headers, cache: "no-store", body: body ? JSON.stringify(body) : undefined
    });
    if (sessionToken !== token) throw new Error("La sesión cambió.");
    const data = await response.json().catch(() => null);
    if (response.status === 401 && sessionToken) {
      logout("Tu sesión venció. Vuelve a iniciar sesión.");
    }
    if (!response.ok) throw new Error(data?.message || "No se pudo completar la operación.");
    return data;
  }

  function render() {
    const query = byId("search").value.trim().toLocaleLowerCase("es");
    const status = byId("filter").value;
    const matching = items.filter((item) =>
      (!status || item.status === status) &&
      (item.name + " " + (item.description || "")).toLocaleLowerCase("es").includes(query)
    );
    const list = byId("list");
    list.replaceChildren();
    const stats = byId("stats");
    stats.replaceChildren();
    for (const [key, label] of Object.entries(states)) {
      const stat = document.createElement("div");
      stat.className = "metric";
      const value = document.createElement("strong");
      value.textContent = items.filter((item) => item.status === key).length;
      const caption = document.createElement("span");
      caption.textContent = label;
      stat.append(value, caption);
      stats.append(stat);
    }
    for (const item of matching) {
      const row = document.createElement("li");
      const summary = document.createElement("div");
      const name = document.createElement("strong");
      const details = document.createElement("small");
      name.textContent = item.name;
      const badge = document.createElement("span");
      badge.className = "pill " + item.status;
      badge.textContent = states[item.status];
      summary.append(name, badge);
      if (item.description) {
        details.textContent = item.description;
        summary.append(details);
      }
      const info = document.createElement("details");
      const caption = document.createElement("summary");
      caption.textContent = "Ficha e historial";
      info.append(caption);
      const date = (value) => value ? new Date(value).toLocaleString("es-CO") : "Sin registro";
      const facts = [
        ["Hallazgo", item.foundAt], ["Ubicación", item.location], ["Recepción", date(item.receivedAt)],
        ["Solicitante", item.claimedBy]
      ];
      for (const [label, value] of facts) {
        if (!value) continue;
        const line = document.createElement("p");
        line.textContent = label + " · " + value;
        info.append(line);
      }
      if (item.photoUrl?.startsWith("https://")) {
        const photo = document.createElement("a");
        photo.href = item.photoUrl;
        photo.target = "_blank";
        photo.rel = "noopener noreferrer";
        photo.textContent = "Ver foto";
        info.append(photo);
      }
      for (const entry of item.history || []) {
        const line = document.createElement("p");
        line.textContent = date(entry.at) + " · " + entry.action + " · " + entry.actor
          + (entry.reason ? " · " + entry.reason : "");
        info.append(line);
      }
      summary.append(info);
      row.append(summary);
      const actions = document.createElement("div");
      actions.className = "action-set";
      if (item.status === "claimed") {
        addAction(actions, "Aprobar", () => review(item, "approve"));
        addAction(actions, "Rechazar", () => review(item, "reject"));
      } else if (item.status === "approved") {
        addAction(actions, "Marcar entregado", () => deliver(item));
      }
      if (actions.childElementCount) row.append(actions);
      list.append(row);
    }
    const empty = byId("empty");
    empty.hidden = matching.length > 0;
    empty.textContent = items.length ? "No hay objetos que coincidan con los filtros." : "No hay objetos registrados.";
  }

  function addAction(container, label, action) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "secondary";
    button.textContent = label;
    button.addEventListener("click", () => buttons(button, action));
    container.append(button);
  }

  function renderUsers() {
    const list = byId("users");
    list.replaceChildren();
    if (!users.length) {
      const row = document.createElement("li");
      row.textContent = "No hay cuentas estudiantiles configuradas.";
      list.append(row);
    }
    for (const user of users) {
      const row = document.createElement("li");
      const name = document.createElement("span");
      name.textContent = user.email + (user.suspended ? " · Suspendido" : " · Activo");
      row.append(name);
      addAction(row, user.suspended ? "Reactivar" : "Suspender", async () => {
        if (!user.suspended && !confirm("¿Suspender la cuenta e invalidar sus sesiones?")) return;
        const updated = await request("/v1/admin/users/" + encodeURIComponent(user.id) + "/suspension", {
          method: "POST", body: {suspended: !user.suspended}
        });
        users = users.map((entry) => entry.id === updated.id ? updated : entry);
        renderUsers();
        message(updated.suspended ? "Cuenta suspendida." : "Cuenta reactivada.");
      });
      list.append(row);
    }
  }

  async function review(item, decision) {
    const reason = decision === "reject" ? prompt("Motivo del rechazo") : "";
    if (decision === "reject" && !reason?.trim()) return;
    const result = await request(objectsPath + "/" + encodeURIComponent(item.id) + "/review", {
      method: "POST", body: {decision, reason}
    });
    revision++;
    items = items.map((entry) => entry.id === result.id ? result : entry);
    render();
    message(decision === "approve" ? "Reclamación aprobada." : "Reclamación rechazada.");
  }

  async function buttons(button, action) {
    button.disabled = true;
    try { await action(); }
    catch (error) { if (token) message(error.message, true); }
    finally { button.disabled = false; }
  }

  async function refresh() {
    const version = ++revision;
    const result = await request(objectsPath);
    if (version === revision) {
      items = result;
      render();
    }
  }

  async function deliver(item) {
    if (!confirm("¿Marcar como entregado «" + item.name + "»?")) return;
    const result = await request(objectsPath + "/" + encodeURIComponent(item.id) + "/deliver", { method: "POST" });
    revision++;
    items = items.map((entry) => entry.id === result.id ? result : entry);
    render();
    message("Objeto marcado como entregado.");
  }

  byId("login").addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    const submit = form.querySelector("button");
    submit.disabled = true;
    byId("login-error").textContent = "";
    try {
      const body = Object.fromEntries(new FormData(form));
      const result = await request("/v1/admin/login", { method: "POST", body });
      token = result.accessToken;
      form.reset();
      message("");
      showInventory(true);
      openSection("all-items");
      byId("search").focus();
      await refresh();
      users = await request("/v1/admin/users");
      renderUsers();
    } catch (error) {
      if (token) message(error.message, true);
      else if (!byId("login-error").textContent) byId("login-error").textContent = error.message;
    } finally {
      submit.disabled = false;
    }
  });

  byId("register").addEventListener("submit", (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    buttons(form.querySelector("button"), async () => {
      const body = Object.fromEntries(new FormData(form));
      if (!body.photoUrl) delete body.photoUrl;
      const item = await request(objectsPath, { method: "POST", body });
      revision++;
      items.unshift(item);
      render();
      form.reset();
      message("Objeto registrado en el inventario.");
    });
  });

  function openSection(section) {
    const students = section === "students";
    const pending = section === "pending";
    const filter = byId("filter");
    byId("inventory-view").hidden = students;
    byId("students-view").hidden = !students;
    byId("register").hidden = pending;
    byId("inventory-view").classList.toggle("layout", !pending);
    filter.value = pending ? "claimed" : "";
    filter.disabled = pending;
    byId("search").value = "";
    byId("list-heading").textContent = pending ? "Reclamaciones pendientes" : "Objetos registrados";
    for (const tab of ["all-items", "pending", "students"]) {
      byId(tab).setAttribute("aria-pressed", String(section === tab));
    }
    render();
    if (students) renderUsers();
  }

  for (const section of ["all-items", "pending", "students"]) {
    byId(section).addEventListener("click", () => openSection(section));
  }
  byId("logout").addEventListener("click", () => logout());
  byId("search").addEventListener("input", render);
  byId("filter").addEventListener("change", render);
  byId("reload").addEventListener("click", (event) => buttons(event.currentTarget, refresh));
</script>
</html>
