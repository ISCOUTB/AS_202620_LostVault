name: Flutter checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Esta verificación es explícita para que un cambio incompatible del
      # contrato bloquee el merge aunque otras pruebas sigan pasando.
      - name: Verify API consumer contract
        run: flutter test test/api_contract_test.dart
