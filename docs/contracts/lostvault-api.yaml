openapi: 3.1.1
info:
  title: LostVault Claims API
  version: 1.0.0
  description: >-
    Contrato versionado de la frontera HTTP para reclamar un objeto perdido.
    La especificación es la fuente de verdad para el consumidor Flutter y el
    proveedor que la implemente.
servers:
  - url: https://api.lostvault.example
paths:
  /v1/auth/login:
    post:
      operationId: login
      summary: Inicia sesión con correo institucional y contraseña.
      description: >-
        Devuelve un JWT para usar como Bearer en el resto de operaciones. El
        correo debe pertenecer a un dominio institucional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: El inicio de sesión no está configurado en el servidor (AUTH_NOT_CONFIGURED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/objects:
    post:
      operationId: createObject
      summary: Registra un objeto perdido.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateObjectRequest'
      responses:
        '201':
          description: Objeto registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LostObject'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/objects/{objectId}:
    delete:
      operationId: deleteObject
      summary: Borra un objeto perdido que reportó el propio usuario.
      security:
        - bearerAuth: []
      parameters:
        - name: objectId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '204':
          description: Objeto borrado.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: El objeto lo reportó otro usuario (FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/ObjectNotFound'
        '409':
          $ref: '#/components/responses/ObjectAlreadyClaimed'
  /v1/objects/{objectId}/claims:
    post:
      operationId: createClaim
      summary: Solicita la reclamación de un objeto disponible.
      description: >-
        El proveedor identifica al usuario a partir del token y verifica su
        identidad antes de crear la reclamación. La operación es idempotente:
        el cliente debe enviar la misma Idempotency-Key en cada reintento, y si
        el objeto ya fue reclamado por el mismo usuario se devuelve la
        reclamación existente con 200 en lugar de 409.
      security:
        - bearerAuth: []
      parameters:
        - name: objectId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Identificador único (p. ej. UUID v4) generado por el cliente para
            esta intención de reclamar. Se reenvía igual en cada reintento.
            Vigencia: 24 h, por usuario.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        '201':
          description: Reclamación creada y verificada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
              examples:
                verifiedClaim:
                  value:
                    objectId: '1'
                    userId: student-42
                    verified: true
          headers:
            Idempotent-Replayed:
              description: Vale "true" cuando la respuesta es la repetición de una petición anterior con la misma Idempotency-Key.
              schema:
                type: string
        '200':
          description: >-
            El objeto ya estaba reclamado por este mismo usuario (petición
            repetida sin Idempotency-Key). Se devuelve la reclamación existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: '#/components/responses/InvalidIdempotencyKey'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ObjectNotFound'
        '409':
          $ref: '#/components/responses/ObjectAlreadyClaimed'
        '422':
          $ref: '#/components/responses/UnprocessableClaim'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Claim:
      type: object
      additionalProperties: false
      required:
        - objectId
        - userId
        - verified
      properties:
        objectId:
          type: string
        userId:
          type: string
        verified:
          type: boolean
          const: true
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: bearer
        expiresIn:
          type: integer
          description: Segundos de vigencia del token.
    CreateObjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 1000
    LostObject:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        reportedBy:
          type: [string, 'null']
        claimedBy:
          type: [string, 'null']
    Problem:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - OBJECT_NOT_FOUND
            - OBJECT_ALREADY_CLAIMED
            - IDENTITY_NOT_VERIFIED
            - IDEMPOTENCY_KEY_REUSED
            - INVALID_IDEMPOTENCY_KEY
            - INVALID_CREDENTIALS
            - AUTH_NOT_CONFIGURED
            - VALIDATION_ERROR
            - FORBIDDEN
        message:
          type: string
  responses:
    Unauthenticated:
      description: No existe una sesión autenticada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ObjectNotFound:
      description: El objeto solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ObjectAlreadyClaimed:
      description: El objeto ya fue reclamado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableClaim:
      description: >-
        La identidad del usuario no pudo verificarse (IDENTITY_NOT_VERIFIED), o
        la Idempotency-Key ya se usó para reclamar otro objeto
        (IDEMPOTENCY_KEY_REUSED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidIdempotencyKey:
      description: La cabecera Idempotency-Key viene vacía o supera 255 caracteres.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidCredentials:
      description: Correo o contraseña incorrectos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: El cuerpo de la petición no cumple el esquema (VALIDATION_ERROR).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
