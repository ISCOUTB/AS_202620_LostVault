sonar.projectKey=ISCOUTB_AS_202620_LostVault
sonar.organization=isco-utb

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=AS_202620_LostVault
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=lib,backend
sonar.tests=test,backend
sonar.test.inclusions=test/**,backend/test_api.py,backend/conftest.py
sonar.exclusions=backend/test_api.py,backend/conftest.py,**/*.g.dart,build/**

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Cobertura del backend (Python). Generado por `pytest --cov` en
# .github/workflows/backend.yml antes de que corra este análisis.
sonar.python.coverage.reportPaths=backend/coverage.xml

# Cobertura del cliente Flutter (Dart), si el plan de SonarCloud del
# proyecto tiene habilitado el analizador de Dart. Generado por
# `flutter test --coverage` en .github/workflows/flutter.yml. Si
# SonarCloud no reconoce esta propiedad para el plan actual, se ignora
# sin romper el análisis; verificar en el dashboard qué lenguajes se
# están analizando.
sonar.dart.coverage.reportPaths=coverage/lcov.info
